[package]
name = "soland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "soland"
description = "Reference Arkret v1 principal server implementation built on Salvo, Diesel, and PostgreSQL."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["arkret", "decentralized", "did", "salvo", "server"]
categories = ["network-programming", "web-programming::http-server"]
authors.workspace = true

[features]
default = []
openmls-keypackage-validation = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
# Constant-time equality for MAC/signature token comparison (SOL-03-004:
# presign-token check). Already in the lock tree via the crypto stack.
# events.subscribe streaming. `bytes` for the
# Bytes chunks `salvo::Response::stream` consumes; `futures-util` for
# Stream combinators; `async-stream` for the `stream!` async-generator
# macro that lets us interleave history yields + tokio::select on the
# broadcast channel + heartbeat ticker.
# Production Ed25519 JWS verification. ed25519-dalek
# does the verify; bs58 decodes the multibase (base58btc-prefixed-z) public key
# segment of did:key DID URLs and didDocument verificationMethod entries.
# Lock-free pointer swap for the NotaryWorker signing key. Used
# by `rotate-signing-key` admin endpoint so concurrent signing passes never
# observe a torn read across the rotation.
# `rand` for fresh ed25519 seed generation in rotate-signing-key.
# Durable, observable tracing output when the runner harness sets
# `SOLAND_LOG_FILE`. Without this appender, Windows fully-buffers stdout
# when it's redirected to a file (PowerShell `Start-Process
# -RedirectStandardOutput` chained through `cargo run`), so tracing
# output is lost on graceful shutdown. The non-blocking appender keeps
# the channel off the request path; we hold its guard for the
# process lifetime so it flushes before exit.
anyhow = {workspace = true}
arc-swap = {workspace = true}
async-stream = {workspace = true}
async-trait = {workspace = true}
base64 = {workspace = true}
bs58 = {workspace = true}
bytes = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
arkret-core = {workspace = true,features = ["client", "salvo"]}
arkret-event-draft.workspace = true
arkret-auth.workspace = true
arkret-bootstrap.workspace = true
arkret-crypto = {workspace = true,features = ["account-data"]}
arkret-http-client.workspace = true
arkret-identity.workspace = true
arkret-keystore = {workspace = true,features = ["keystore-macos", "keystore-linux", "keystore-windows", "keystore-encrypted-file"]}
arkret-mls.workspace = true
arkret-models-collaboration.workspace = true
arkret-models-crypto = {workspace = true}
arkret-policy.workspace = true
arkret-server.workspace = true
arkret-signatures = {workspace = true,features = ["protocol", "signer"]}
arkret-state = {workspace = true,features = ["salvo"]}
arkret-wire = {workspace = true}
dotenvy = {workspace = true}
ed25519-dalek = {workspace = true}
futures-util = {workspace = true}
hex = {workspace = true}
hmac = {workspace = true}
metrics = {workspace = true}
metrics-exporter-prometheus = {workspace = true,default-features = false}
object_store = {workspace = true,features = ["aws"]}
opentelemetry = {workspace = true,default-features = false,features = ["trace"],optional = true}
opentelemetry-otlp = {workspace = true,default-features = false,features = ["trace", "grpc-tonic"],optional = true}
opentelemetry_sdk = {workspace = true,default-features = false,features = ["trace", "rt-tokio"],optional = true}
parking_lot = {workspace = true}
rand = {workspace = true}
# `url::Url` to feed the shared SDK `webvh::prepare_service_inception` primitive
# when self-bootstrapping the deployment's own service DID (identity-did §3.7).
# Already present in the lock tree via arkret-sdk.
url = "2.5"
# ChaCha20 rng seeded from OS entropy for the self-bootstrap mint. Pinned to
# 0.3 so its `rand_core` 0.6 `RngCore` matches the SDK inception primitive
# (the dalek stack pins that ecosystem); already in the lock tree via the SDK.
rand_chacha = "0.3.1"
reqwest = {workspace = true,default-features = false,features = ["form", "json", "rustls"]}
salvo = {workspace = true,default-features = false,features = ["cookie", "fix-http1-request-uri", "server", "server-handle", "http1", "http2", "matched-path", "ring", "affix-state", "catch-panic", "cors", "oapi", "rustls"]}
salvo-oapi = {workspace = true,features = ["yaml"]}
serde = {workspace = true,features = ["derive"]}
serde_json = {workspace = true}
sha2 = {workspace = true}
soland-contracts = {workspace = true,features = ["salvo"]}
soland-domain = {workspace = true}
soland-application = {workspace = true}
soland-http = {workspace = true}
soland-storage = {workspace = true}
soland-storage-memory = {workspace = true}
soland-storage-postgres = {workspace = true}
subtle = {workspace = true}
thiserror = {workspace = true}
tokio = {workspace = true,features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"]}
tokio-postgres = {workspace = true}
tracing = {workspace = true}
tracing-appender = {workspace = true}
tracing-opentelemetry = {workspace = true,default-features = false,optional = true}
tracing-subscriber = {workspace = true,features = ["env-filter", "json"]}
uuid = {workspace = true,features = ["v4", "v7", "serde"]}
zeroize = {workspace = true,features = ["derive"]}

[dev-dependencies]
proptest = {workspace = true}
salvo = {workspace = true,features = ["test"]}
soland-test-support = {workspace = true}
# `test-util` enables the paused-clock test runtime
# (`#[tokio::test(start_paused = true)]`) used to assert the federation
# auth-failure timing-bucket pad deterministically without a real sleep.
tokio = {workspace = true,features = ["test-util"]}
