[package]
name = "soland-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Transport- and adapter-independent Soland application use cases."

[features]
default = []
test-support = []

[dependencies]
arkret-canonical.workspace = true
arkret-event-draft.workspace = true
arkret-identifiers.workspace = true
arkret-identity.workspace = true
arkret-models-collaboration.workspace = true
arkret-models-crypto.workspace = true
arkret-models-identity.workspace = true
arkret-models-integration.workspace = true
arkret-policy.workspace = true
arkret-schema = { workspace = true, features = ["embedded-artifacts"] }
arkret-state.workspace = true
arkret-wire.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
futures-util.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
soland-domain.workspace = true
soland-storage.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

