[package]
name = "soland-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Shared deployment-local contracts for Soland integrations."

[features]
default = []
salvo = [
    "dep:salvo",
    "arkret-identifiers/salvo",
    "arkret-models-collaboration/salvo-oapi",
    "arkret-models-crypto/salvo-oapi",
    "arkret-wire/salvo-oapi",
]

[dependencies]
arkret-canonical.workspace = true
arkret-identifiers.workspace = true
arkret-models-collaboration.workspace = true
arkret-models-crypto.workspace = true
arkret-wire.workspace = true
chrono = {workspace = true,features = ["serde"]}
salvo = {workspace = true,optional = true,features = ["oapi"]}
serde = {workspace = true,features = ["derive"]}
serde_json = {workspace = true}
