[package]
name = "soland-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Shared deployment-local contracts for Soland integrations."

[features]
default = []
salvo = ["dep:salvo", "arkret-core/salvo"]

[dependencies]
arkret-canonical.workspace = true
arkret-core = {workspace = true,default-features = false}
chrono = {workspace = true,features = ["serde"]}
salvo = {workspace = true,optional = true,features = ["oapi"]}
serde = {workspace = true,features = ["derive"]}
serde_json = {workspace = true}
