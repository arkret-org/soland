replicaCount: 2

image:
  repository: ghcr.io/cokret/soland
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8698

ingress:
  enabled: false
  className: ""
  hosts:
    - host: soland.example
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  SOLAND_BIND: 0.0.0.0:8698
  SOLAND_PUBLIC_BASE_URL: https://soland.example
  SOLAND_SERVICE_DID: did:web:soland.example
  SOLAND_OBJECT_STORAGE_BACKEND: s3-compatible
  SOLAND_OBJECT_STORAGE_S3_BUCKET: soland
  SOLAND_OBJECT_STORAGE_S3_REGION: us-east-1
  SOLAND_OBJECT_STORAGE_S3_FORCE_PATH_STYLE: "true"
  SOLAND_OBJECT_STORAGE_PREFIX: prod
  SOLAND_CORS_ALLOW_ORIGIN: https://app.example
  RUST_LOG: soland=info,salvo=info,warn

secretEnv:
  DATABASE_URL: ""
  SOLAND_OAUTH_INTROSPECTION_URL: ""
  SOLAND_OAUTH_INTROSPECTION_BEARER: ""
  SOLAND_OBJECT_STORAGE_S3_ENDPOINT: ""
  SOLAND_OBJECT_STORAGE_S3_ACCESS_KEY_ID: ""
  SOLAND_OBJECT_STORAGE_S3_SECRET_ACCESS_KEY: ""

existingSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

networkPolicy:
  enabled: false
  ingressCidrs: []
  egress:
    databaseCidrs: []
    objectStorageCidrs: []
    oauthCidrs: []

nodeSelector: {}
tolerations: []
affinity: {}
