name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout soland
        uses: actions/checkout@v6

      - name: Check spelling
        uses: crate-ci/typos@v1.45.2

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout soland
        uses: actions/checkout@v6
        with:
          path: soland

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: soland -> target

      # ARC-0002 (重构计划 2026-07-10): legacy patterns must ratchet to zero.
      - name: Deletion gate
        run: bash scripts/deletion_gate.sh
        working-directory: soland
        shell: bash

      - name: Environment documentation gate
        run: python scripts/check-env-docs.py
        working-directory: soland

      - name: Rustfmt
        run: cargo +nightly fmt --all -- --check
        working-directory: soland

      - name: Clippy
        run: cargo +1.96 clippy --all-targets --locked -- -D warnings
        working-directory: soland

      - name: Clippy with OpenTelemetry
        run: cargo +1.96 clippy --features otel --all-targets --locked -- -D warnings
        working-directory: soland

      # Keep test binaries separate from `target/dev`, matching the local
      # `just test` gate and preventing Windows dev-server file locks. This
      # command includes the full `-p soland --test http_api` suite.
      - name: Test (includes HTTP API suite)
        env:
          CARGO_TARGET_DIR: target/test
        run: cargo +1.96 test --locked
        working-directory: soland

  migration-cycle:
    name: Migration up/down/up cycle (postgres)
    runs-on: ubuntu-latest
    # Only run on Linux because the PostgreSQL service container is a
    # Linux-only feature in GitHub Actions. The cycle itself is
    # platform-agnostic — running it on one OS is sufficient.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soland
          POSTGRES_PASSWORD: soland
          POSTGRES_DB: soland_cycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soland"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://soland:soland@localhost:5432/soland_cycle
    steps:
      - name: Checkout soland
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install diesel_cli (postgres-only)
        run: |
          cargo install diesel_cli --no-default-features --features postgres --locked

      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U soland && break
            sleep 1
          done

      - name: Apply migrations forwards (baseline schema)
        run: diesel migration run

      - name: Snapshot baseline schema
        run: pg_dump --schema-only --no-owner --no-privileges \
              "$DATABASE_URL" > /tmp/schema.baseline.sql
        env:
          PGPASSWORD: soland

      - name: Revert every migration in reverse order
        run: |
          # `diesel migration revert` removes the most recent applied
          # migration. Loop until none remain. The loop guard is the
          # exit status: revert returns non-zero when there is nothing
          # left to revert.
          while diesel migration revert; do :; done

      - name: Re-apply every migration forwards
        run: diesel migration run

      - name: Snapshot cycled schema
        run: pg_dump --schema-only --no-owner --no-privileges \
              "$DATABASE_URL" > /tmp/schema.cycled.sql
        env:
          PGPASSWORD: soland

      - name: Diff cycled schema against baseline
        run: |
          if ! diff -u /tmp/schema.baseline.sql /tmp/schema.cycled.sql; then
            echo "::error::Migration up→down→up cycle did not round-trip cleanly."
            echo "::error::Each migration's down.sql must exactly invert its up.sql."
            exit 1
          fi

  postgres-http-api:
    name: Postgres HTTP API cursor tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soland
          POSTGRES_PASSWORD: soland
          POSTGRES_DB: soland_cursor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soland"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://soland:soland@localhost:5432/soland_cursor
    steps:
      - name: Checkout soland
        uses: actions/checkout@v6
        with:
          path: soland

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: soland -> target

      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U soland && break
            sleep 1
          done

      - name: Test sync cursor restart behavior
        run: cargo test --locked -p soland --test http_api cursor_handle
        working-directory: soland
