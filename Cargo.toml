[package]
name = "soland"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
default-run = "soland"
description = "Reference Cokret v1 principal server implementation built on Salvo, Diesel, and PostgreSQL."
license = "Apache-2.0"
repository = "https://github.com/cokret/soland"
homepage = "https://github.com/cokret/soland"
readme = "README.md"
keywords = ["cokret", "decentralized", "did", "salvo", "server"]
categories = ["network-programming", "web-programming::http-server"]
authors = ["Cokret contributors"]

[features]
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
cokret-sdk = { package = "cokret", path = "../cokret-rust-sdk/crates/sdk", features = ["full-surface", "device-runtime", "applet-runtime", "salvo", "signer"] }
diesel = { version = "2.3.8", features = ["postgres", "r2d2", "serde_json", "chrono", "uuid", "pq-src"] }
diesel-async = { version = "0.8", features = ["postgres", "deadpool", "async-connection-wrapper"] }
deadpool = { version = "0.13", features = ["rt_tokio_1"] }
async-trait = "0.1.89"
diesel_migrations = { version = "2.3.0", features = ["postgres"] }
dotenvy = "0.15.7"
base64 = "0.22.1"
salvo = { version = "0.93.0", default-features = false, features = ["cookie", "fix-http1-request-uri", "server", "server-handle", "http1", "http2", "test", "matched-path", "ring", "affix-state", "cors", "oapi", "rustls"] }
salvo-oapi = { version = "0.93.0", features = ["yaml"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# events.subscribe streaming. `bytes` for the
# Bytes chunks `salvo::Response::stream` consumes; `futures-util` for
# Stream combinators; `async-stream` for the `stream!` async-generator
# macro that lets us interleave history yields + tokio::select on the
# broadcast channel + heartbeat ticker.
bytes = "1.10.1"
futures-util = "0.3.31"
async-stream = "0.3.6"
object_store = { version = "0.13.2", features = ["aws"] }
# Production Ed25519 JWS verification. ed25519-dalek
# does the verify; bs58 decodes the multibase (base58btc-prefixed-z) public key
# segment of did:key DID URLs and didDocument verificationMethod entries.
ed25519-dalek = "2.1.1"
bs58 = "0.5.1"
# Lock-free pointer swap for the AnchorerWorker signing key. Used
# by `rotate-signing-key` admin endpoint so concurrent signing passes never
# observe a torn read across the rotation.
arc-swap = "1.7.1"
# `rand` for fresh ed25519 seed generation in rotate-signing-key.
rand = "0.8.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
opentelemetry = { version = "0.31.0", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = ["trace", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.31.0", default-features = false, features = ["trace", "grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.32.1", default-features = false, optional = true }
# Durable, observable tracing output when the runner harness sets
# `SOLAND_LOG_FILE`. Without this appender, Windows fully-buffers stdout
# when it's redirected to a file (PowerShell `Start-Process
# -RedirectStandardOutput` chained through `cargo run`), so tracing
# output is lost on graceful shutdown. The non-blocking appender keeps
# write latency off the request path; we hold its guard for the
# process lifetime so the channel flushes before exit.
tracing-appender = "0.2.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1.18.1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
# Stream J conformance gates (`tests/conformance_gates.rs`): operation_id
# registry diff + forbidden-terms scan. `walkdir` for recursing src/,
# `regex` for the line-level pattern scan.
walkdir = "2.5"
regex = "1.11"
