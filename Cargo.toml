[package]
name = "serverx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
contrix-sdk = { path = "../contrix-rust-sdk/crates/contrix-sdk" }
diesel = { version = "2.3.8", features = ["postgres", "r2d2", "serde_json", "chrono", "pq-src"] }
diesel_migrations = { version = "2.3.0", features = ["postgres"] }
dotenvy = "0.15.7"
base64 = "0.22.1"
salvo = { version = "0.92.2", features = ["affix-state", "cors"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
