[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/server",
    "crates/data",
]
default-members = ["crates/server"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/cokret/soland"
homepage = "https://github.com/cokret/soland"
authors = ["Cokret contributors"]

[workspace.dependencies]
anyhow = "1.0.102"
arc-swap = "1.9.1"
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22.1"
blake3 = { version = "1.5.5", default-features = false }
bs58 = "0.5.1"
bytes = "1.11.1"
chrono = "0.4.45"
chrono-tz = { version = "0.10.4", default-features = false }
cokret-core = { path = "../cokret-rust-sdk/crates/core", default-features = false }
cokret-sdk = { package = "cokret", path = "../cokret-rust-sdk/crates/sdk" }
deadpool = "0.13"
diesel = "2.3.10"
diesel-async = "0.9"
diesel_migrations = "2.3.2"
dotenvy = "0.15.7"
ed25519-dalek = "2.2.0"
futures-util = "0.3.32"
hex = "0.4.3"
hmac = "0.13"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
object_store = "0.13.2"
opentelemetry = { version = "0.32.0", default-features = false }
opentelemetry-otlp = { version = "0.32.0", default-features = false }
opentelemetry_sdk = { version = "0.32.1", default-features = false }
parking_lot = "0.12"
proptest = "1.6.0"
rand = "0.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["form"] }
salvo = { git = "https://github.com/salvo-rs/salvo.git", branch = "main", default-features = false }
salvo-oapi = { git = "https://github.com/salvo-rs/salvo.git", branch = "main" }
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.11.0"
soland-core = { path = "crates/core" }
soland-data = { version = "0.3.0", path = "crates/data" }
subtle = "2.6.1"
thiserror = "2"
tokio = "1.52.3"
tokio-postgres = "0.7.17"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = "0.3.23"
uuid = "1.23.3"
