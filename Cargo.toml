[workspace]
resolver = "3"
members = [
    "xtask",
    "crates/contracts",
    "crates/domain",
    "crates/application",
    "crates/http",
    "crates/test-support",
    "crates/storage",
    "crates/storage-memory",
    "crates/storage-postgres",
    "crates/server",
]
default-members = ["crates/server"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/arkret-org/soland"
homepage = "https://github.com/arkret-org/soland"
authors = ["Arkret contributors"]

[workspace.dependencies]
anyhow = "1.0.102"
arc-swap = "1.9.1"
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22.1"
bs58 = "0.5.1"
bytes = "1.11.1"
chrono = "0.4.45"
arkret-core = { version = "0.3.0", path = "../arkret-rust-sdk/crates/core", default-features = false, features = ["embedded-artifacts"] }
arkret-hlc = { version = "0.3.0", path = "../arkret-rust-sdk/crates/hlc", default-features = false }
arkret-event-draft = { version = "0.3.0", path = "../arkret-rust-sdk/crates/event-draft", default-features = false }
arkret-auth = { version = "0.3.0", path = "../arkret-rust-sdk/crates/auth", default-features = false }
arkret-bootstrap = { version = "0.3.0", path = "../arkret-rust-sdk/crates/bootstrap", default-features = false }
arkret-crypto = { version = "0.3.0", path = "../arkret-rust-sdk/crates/crypto", default-features = false }
arkret-http-client = { version = "0.3.0", path = "../arkret-rust-sdk/crates/http-client", default-features = false }
arkret-identifiers = { version = "0.3.0", path = "../arkret-rust-sdk/crates/identifiers", default-features = false }
arkret-identity = { version = "0.3.0", path = "../arkret-rust-sdk/crates/identity", default-features = false }
arkret-keystore = { version = "0.3.0", path = "../arkret-rust-sdk/crates/keystore", default-features = false }
arkret-lattice-registry = { version = "0.3.0", path = "../arkret-rust-sdk/crates/lattice-registry", default-features = false }
arkret-mls = { version = "0.3.0", path = "../arkret-rust-sdk/crates/mls", default-features = false }
arkret-models-crypto = { version = "0.3.0", path = "../arkret-rust-sdk/crates/models-crypto", default-features = false }
arkret-models-collaboration = { version = "0.3.0", path = "../arkret-rust-sdk/crates/models-collaboration", default-features = false }
arkret-policy = { version = "0.3.0", path = "../arkret-rust-sdk/crates/policy", default-features = false }
arkret-schema = { version = "0.3.0", path = "../arkret-rust-sdk/crates/schema", default-features = false }
arkret-server = { version = "0.3.0", path = "../arkret-rust-sdk/crates/server", default-features = false }
arkret-signatures = { version = "0.3.0", path = "../arkret-rust-sdk/crates/signatures", default-features = false }
arkret-state = { version = "0.3.0", path = "../arkret-rust-sdk/crates/state", default-features = false }
arkret-wire = { version = "0.3.0", path = "../arkret-rust-sdk/crates/wire", default-features = false }
deadpool = "0.13"
diesel = "2.3.10"
diesel-async = "0.9"
diesel_migrations = "2.3.2"
dotenvy = "0.15.7"
ed25519-dalek = "2.2.0"
futures-util = "0.3.32"
hex = "0.4.3"
hmac = "0.13"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
object_store = "0.14.1"
opentelemetry = { version = "0.32.0", default-features = false }
opentelemetry-otlp = { version = "0.32.0", default-features = false }
opentelemetry_sdk = { version = "0.32.1", default-features = false }
parking_lot = "0.12"
proptest = "1.6.0"
rand = "0.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["form"] }
salvo = { version = "0.95", default-features = false }
salvo-oapi = { version = "0.95", default-features = false }
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.11.0"
soland-contracts = { version = "0.3.0", path = "crates/contracts" }
soland-domain = { version = "0.3.0", path = "crates/domain" }
soland-application = { version = "0.3.0", path = "crates/application" }
soland-http = { version = "0.3.0", path = "crates/http" }
soland-test-support = { version = "0.3.0", path = "crates/test-support" }
soland-storage = { version = "0.3.0", path = "crates/storage" }
soland-storage-memory = { version = "0.3.0", path = "crates/storage-memory" }
soland-storage-postgres = { version = "0.3.0", path = "crates/storage-postgres" }
url = "2.5"
subtle = "2.6.1"
thiserror = "2"
tokio = "1.52.3"
tokio-postgres = "0.7.17"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = "0.3.23"
uuid = "1.23.3"
zeroize = "1.8.2"
